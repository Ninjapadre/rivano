<style>
  :root {
    --ivory: #F5EFE4;
    --soft-black: #15110F;
    --gold: #BFA46A;
    --terra: #B0703E;
    --serif: "Cormorant Garamond", "Times New Roman", serif;
    --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body { font-family: var(--sans); color: var(--ivory); background: #000; overflow: hidden; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; }

  /* ---------------- FULL-BLEED CAMERA ---------------- */
  /* #scene is the camera target: GSAP applies translate + scale to it. */
  /* #scene is the fixed viewport window; #plate is the full (wider-than-screen)
     image that the camera pans/scales inside it. */
  .showroom-transition { position: fixed; inset: 0; overflow: hidden; z-index: 0; background: #000; }
  .plate { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
  .plate img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center; display: block; will-change: transform, opacity; backface-visibility: hidden; }
  /* the storefront entry is centred */
  .view-angle { object-position: center; }
  .view-front { opacity: 0; }

  .vignette { position: fixed; inset: 0; z-index: 2; pointer-events: none; opacity: 0; visibility: hidden;
    background: radial-gradient(125% 96% at 50% 48%, rgba(0,0,0,0) 52%, rgba(0,0,0,0.5) 100%),
                linear-gradient(to bottom, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0) 20%, rgba(0,0,0,0) 70%, rgba(0,0,0,0.66) 100%); }

  /* ---------------- INTRO TEXT ---------------- */
  .intro-wrap { position: fixed; inset: 0; z-index: 6; display: flex; align-items: center; pointer-events: none; }
  .intro-text { padding-left: 7%; max-width: 640px; }
  .intro-eyebrow { display: flex; align-items: center; gap: 16px; font-size: 13px; letter-spacing: 0.32em; text-transform: uppercase; color: var(--gold); margin-bottom: 28px; }
  .intro-eyebrow::before { content: ""; width: 50px; height: 1px; background: var(--gold); opacity: 0.85; }
  .intro-text h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(56px, 6.6vw, 100px); line-height: 0.98; letter-spacing: -0.01em; margin: 0; text-shadow: 0 2px 30px rgba(0,0,0,0.5); }
  .intro-text h1 .em { color: var(--gold); font-style: italic; font-weight: 500; }
  .intro-loading { display: flex; align-items: center; gap: 14px; margin-top: 42px; font-size: 13px; letter-spacing: 0.22em; text-transform: uppercase; color: rgba(245,239,228,0.65); }
  .intro-loading .bar { width: 120px; height: 1px; background: rgba(245,239,228,0.2); overflow: hidden; }
  .intro-loading .bar i { display: block; height: 100%; width: 0; background: var(--gold); animation: load 2.4s ease forwards; }
  @keyframes load { to { width: 100%; } }

  /* ---------------- OVERLAY (dots + names) ---------------- */
  /* This layer is NOT scaled with the camera — JS repositions each marker
     every frame so the dots & names track their panel as the camera pans. */
  .panels { position: fixed; inset: 0; z-index: 3; opacity: 0; visibility: hidden; pointer-events: none; }

  .spot { position: absolute; left: 0; top: 0; width: 86px; height: 86px; margin: -43px 0 0 -43px;
    background: transparent; border: 0; padding: 0; display: grid; place-items: center; pointer-events: auto; outline: none; cursor: pointer; }
  /* soft luminous core that sits ON the stone */
  .spot .ring { position: relative; width: 60px; height: 60px; border-radius: 50%; border: 0; backdrop-filter: none;
    background: radial-gradient(circle, rgba(255,239,208,0.55) 0%, rgba(255,212,150,0.26) 36%, rgba(255,200,140,0) 70%);
    display: grid; place-items: center; transition: transform .45s cubic-bezier(.5,0,.2,1); }
  .spot .ring::after { content: ""; width: 26px; height: 26px; border-radius: 50%; background: transparent;
    border: 1px solid rgba(255,236,206,0.72); box-shadow: 0 0 10px rgba(255,214,150,0.4), inset 0 0 7px rgba(255,214,150,0.22);
    transition: transform .4s ease, border-color .4s ease, box-shadow .4s ease; }
  /* the pulsing luminous halo */
  .spot .halo { position: absolute; width: 60px; height: 60px; border-radius: 50%; border: 0; pointer-events: none;
    background: radial-gradient(circle, rgba(255,219,164,0.5) 0%, rgba(255,210,150,0.16) 45%, rgba(255,200,140,0) 70%);
    animation: spotPulse 2.8s ease-in-out infinite; }
  @keyframes spotPulse { 0%, 100% { transform: scale(0.6); opacity: .35; } 50% { transform: scale(1.3); opacity: .9; } }
  .spot:hover .ring { transform: scale(1.18); }
  /* "View in 3D" cue beneath the dot — only once the slab is focused */
  .spot .cue { position: absolute; top: calc(50% + 36px); left: 50%; transform: translate(-50%, 4px); white-space: nowrap;
    font-family: var(--sans); font-size: 10px; letter-spacing: 0.26em; text-transform: uppercase; color: var(--gold);
    opacity: 0; pointer-events: none; text-shadow: 0 1px 14px rgba(0,0,0,0.75); transition: opacity .45s ease, transform .45s ease; }
  .spot.active .cue { opacity: 1; transform: translate(-50%, 0); }
  .spot:hover .ring::after { border-color: #fff; box-shadow: 0 0 16px rgba(255,214,150,0.7), inset 0 0 9px rgba(255,214,150,0.3); }
  .spot.active .ring::after { border-color: #fff; box-shadow: 0 0 18px rgba(255,216,150,0.85), inset 0 0 9px rgba(255,214,150,0.35); }
  .spot.active .halo { animation-duration: 1.9s; background: radial-gradient(circle, rgba(255,224,172,0.62) 0%, rgba(255,210,150,0.2) 45%, rgba(255,200,140,0) 70%); }

  .name { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); text-align: center; white-space: normal;
    background: transparent; border: 0; padding: 0; pointer-events: auto; color: var(--ivory); }
  .name .nm { display: block; font-family: var(--serif); font-weight: 400; font-size: clamp(13px, 1.15vw, 17px); line-height: 1.12; letter-spacing: 0.12em; text-transform: uppercase; text-wrap: balance; color: rgba(245,239,228,0.92); text-shadow: 0 1px 18px rgba(0,0,0,0.6); transition: color .4s ease; }
  .name .rule { position: absolute; left: 50%; top: calc(100% + 13px); transform: translateX(-50%); width: 0; height: 1px; background: var(--gold); opacity: 0; transition: width .5s cubic-bezier(.5,0,.2,1), opacity .4s ease; }
  .name .go { position: absolute; left: 50%; top: calc(100% + 24px); transform: translate(-50%, 5px); display: inline-flex; align-items: center; gap: 8px; font-family: var(--sans); font-size: 10px; letter-spacing: 0.26em; text-transform: uppercase; white-space: nowrap; color: var(--gold); opacity: 0; transition: opacity .45s ease, transform .45s ease; pointer-events: none; }
  .name .go svg { width: 16px; height: 11px; stroke: currentColor; fill: none; stroke-width: 1.4; }
  .name:hover .nm { color: #fff; }
  .name.active .nm { color: #fff; }
  .name.active .rule { width: 34px; opacity: 0.8; }
  .name.active .go { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }

  /* ---------------- TOP BAR ---------------- */
  .topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 40; display: flex; align-items: center; gap: 28px;
    padding: 26px clamp(24px,3vw,48px); opacity: 0; visibility: hidden; }
  .brand { display: flex; flex-direction: column; line-height: 1; }
  .brand-name { font-family: var(--serif); font-weight: 500; font-size: 21px; letter-spacing: 0.2em; white-space: nowrap; }
  .brand-sub { font-size: 8px; letter-spacing: 0.26em; color: rgba(245,239,228,0.6); margin-top: 5px; white-space: nowrap; }
  .brand { flex: 0 0 auto; }
  .top-mid { margin: 0 auto; display: flex; align-items: center; gap: 14px; font-size: 11px; letter-spacing: 0.34em; text-transform: uppercase; color: rgba(245,239,228,0.72); transform: translateY(-7px); }
  .top-mid .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--gold); }
  .top-actions { display: flex; align-items: center; gap: 14px; }
  .pill { display: inline-flex; align-items: center; gap: 10px; padding: 11px 20px; border-radius: 40px; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; border: 1px solid rgba(245,239,228,0.25); color: var(--ivory); background: rgba(14,11,10,0.4); backdrop-filter: blur(6px); transition: all .25s ease; }
  .pill:hover { border-color: var(--gold); background: rgba(191,164,106,0.14); }
  .pill svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.4; }
  .pill[hidden] { display: none; }
  .pill-overview { opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .4s ease; }
  .pill-overview.show { opacity: 1; visibility: visible; pointer-events: auto; }
  .pill-exit { width: 44px; height: 44px; padding: 0; justify-content: center; border-radius: 50%; }
  .pill-exit svg { width: 16px; height: 16px; }

  /* ---------------- HINT ---------------- */
  .hint { position: fixed; left: 50%; bottom: 38px; transform: translateX(-50%); z-index: 35; display: flex; align-items: center; gap: 12px;
    font-size: 11px; letter-spacing: 0.28em; text-transform: uppercase; color: rgba(245,239,228,0.7);
    opacity: 0; transition: opacity .6s ease; pointer-events: none; }
  .hint.show { opacity: 1; }
  .hint .tap { width: 22px; height: 22px; border-radius: 50%; border: 1px solid rgba(245,239,228,0.4); display: grid; place-items: center; animation: pulse 2s ease infinite; }
  .hint .tap::after { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--gold); }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(191,164,106,0.4);} 50% { box-shadow: 0 0 0 7px rgba(191,164,106,0);} }

  /* ---------------- INSPECT BUTTON (focus level) ---------------- */
  .inspect { position: fixed; left: 50%; bottom: 40px; transform: translate(-50%, 12px); z-index: 38;
    display: inline-flex; align-items: center; gap: 12px; padding: 15px 28px; border-radius: 40px;
    font-family: var(--sans); font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
    color: #20180f; background: var(--gold); border: none;
    opacity: 0; visibility: hidden; pointer-events: none;
    transition: opacity .5s ease, transform .5s ease, background .25s ease; }
  .inspect.show { opacity: 1; visibility: visible; pointer-events: auto; transform: translate(-50%, 0); }
  .inspect:hover { background: #cdb47b; }
  .inspect svg { width: 17px; height: 11px; stroke: currentColor; fill: none; stroke-width: 1.6; }

  /* ---------------- REQUEST SAMPLE (focus level) ---------------- */
  .sample-fab { position: fixed; right: clamp(20px,2.5vw,40px); bottom: clamp(28px,4vh,40px); z-index: 38;
    display: inline-flex; align-items: center; gap: 12px; padding: 15px 26px; border-radius: 40px;
    font-family: var(--sans); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--ivory); background: var(--terra); border: 1px solid var(--terra);
    opacity: 0; visibility: hidden; pointer-events: none;
    transition: opacity .5s ease, transform .5s ease, background .25s ease; transform: translateY(12px); }
  .sample-fab.show { opacity: 1; visibility: visible; pointer-events: auto; transform: translateY(0); }
  .sample-fab:hover { background: #9c5f31; border-color: #9c5f31; }
  .sample-fab svg { width: 18px; height: 11px; stroke: currentColor; fill: none; stroke-width: 1.6; transition: transform .25s ease; }
  .sample-fab:hover svg { transform: translateX(4px); }
  @media (max-width: 600px) { .sample-fab { bottom: 96px; padding: 13px 20px; font-size: 10px; } }

  /* ---------------- MATERIAL VIEW (level 3) ---------------- */
  .material { position: fixed; inset: 0; z-index: 60; display: none; background: #0b0908; overflow: hidden; }
  .material-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center;
    will-change: transform, opacity; transform-origin: 50% 50%; backface-visibility: hidden; }
  .material-scrim { position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(to top, rgba(8,6,5,0.82) 0%, rgba(8,6,5,0) 44%),
                linear-gradient(to bottom, rgba(8,6,5,0.5) 0%, rgba(8,6,5,0) 28%); }
  .material-meta { position: absolute; left: clamp(28px,5vw,76px); bottom: clamp(40px,6vw,76px); z-index: 2; }
  .material-cat { font-family: var(--sans); font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--gold); margin-bottom: 16px; }
  .material-name { font-family: var(--serif); font-weight: 400; font-size: clamp(46px, 6.2vw, 96px); line-height: 0.98; letter-spacing: -0.01em; margin: 0; color: var(--ivory); }
  .material-back { position: absolute; top: clamp(24px,3vw,40px); left: clamp(24px,3vw,40px); z-index: 3;
    display: inline-flex; align-items: center; gap: 12px; padding: 12px 22px; border-radius: 40px;
    font-family: var(--sans); font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ivory);
    background: rgba(14,11,10,0.42); border: 1px solid rgba(245,239,228,0.28); backdrop-filter: blur(6px); transition: all .25s ease; }
  .material-back:hover { border-color: var(--gold); background: rgba(191,164,106,0.16); }
  .material-back svg { width: 19px; height: 12px; stroke: currentColor; fill: none; stroke-width: 1.6; }
  .m-nav { position: absolute; top: 50%; transform: translateY(-50%); z-index: 3; width: 56px; height: 56px; border-radius: 50%;
    display: grid; place-items: center; color: var(--ivory); background: rgba(14,11,10,0.4); border: 1px solid rgba(245,239,228,0.26);
    backdrop-filter: blur(6px); transition: all .25s ease; }
  .m-nav:hover { border-color: var(--gold); background: rgba(191,164,106,0.18); }
  .m-nav svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 1.6; }
  .m-prev { left: clamp(20px,2.5vw,40px); }
  .m-next { right: clamp(20px,2.5vw,40px); }

  /* ================= MOBILE PORTRAIT SHOWROOM (material list) ================= */
  .msr { position: fixed; inset: 0; z-index: 70; display: none;
    background: radial-gradient(125% 78% at 50% 0%, #1b1512 0%, #0c0a09 58%); }
  .msr-scroller { position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none;
    padding: calc(94px + env(safe-area-inset-top)) 16px calc(86px + env(safe-area-inset-bottom)); }
  .msr-scroller::-webkit-scrollbar { display: none; }

  .msr-top { position: fixed; top: 0; left: 0; right: 0; z-index: 73;
    display: flex; align-items: flex-start; justify-content: space-between; padding: calc(22px + env(safe-area-inset-top)) 22px 16px;
    background: linear-gradient(to bottom, rgba(12,10,9,0.97) 0%, rgba(12,10,9,0.84) 55%, rgba(12,10,9,0) 100%); }
  .msr-brand { display: flex; flex-direction: column; line-height: 1; }
  .msr-brand .bn { font-family: var(--serif); font-weight: 500; font-size: 20px; letter-spacing: 0.22em; white-space: nowrap; }
  .msr-brand .bs { font-size: 8px; letter-spacing: 0.3em; color: rgba(245,239,228,0.6); margin-top: 6px; }
  .msr-exit { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--ivory);
    background: transparent; border: 1px solid rgba(245,239,228,0.32); }
  .msr-exit svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.4; }

  .msr-head { text-align: center; margin: 2px 0 22px; }
  .msr-eyebrow { display: inline-flex; align-items: center; gap: 14px; font-size: 12px; letter-spacing: 0.3em;
    text-transform: uppercase; color: var(--gold); }
  .msr-eyebrow::before, .msr-eyebrow::after { content: "•"; font-size: 12px; line-height: 1; opacity: 0.9; }
  .msr-sub { font-size: 14px; font-weight: 300; color: rgba(245,239,228,0.66); margin: 14px 0 0; }

  .msr-list { display: flex; flex-direction: column; gap: 14px; }
  .msr-row { display: flex; height: clamp(140px, 21vh, 184px); border: 1px solid rgba(245,239,228,0.1);
    border-radius: 16px; overflow: hidden; background: #19140f; transition: border-color .25s ease, transform .15s ease; }
  .msr-row:active { transform: scale(0.99); border-color: rgba(191,164,106,0.55); }
  .msr-niche { flex: 0 0 36%; position: relative; overflow: hidden; }
  .msr-niche img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .msr-niche::after { content: ""; position: absolute; inset: 0;
    background: linear-gradient(to right, rgba(12,10,9,0) 58%, rgba(12,10,9,0.62) 100%); }
  .msr-swatch { flex: 1; min-width: 0; position: relative; display: flex; align-items: center; justify-content: space-between;
    gap: 8px; padding: 0 16px; background-size: cover; background-position: center; }
  .msr-swatch::before { content: ""; position: absolute; inset: 0;
    background: linear-gradient(to right, rgba(10,8,7,0.66) 0%, rgba(10,8,7,0.28) 52%, rgba(10,8,7,0.42) 100%); }
  .msr-row-name { position: relative; z-index: 2; min-width: 0; flex: 1 1 auto;
    font-family: var(--serif); font-weight: 400; font-size: clamp(16px, 4.5vw, 21px); letter-spacing: 0.03em; text-transform: uppercase; color: var(--ivory);
    text-shadow: 0 1px 16px rgba(0,0,0,0.55); line-height: 1.2; }
  .msr-row-go { position: relative; z-index: 2; flex: 0 0 auto; width: 42px; height: 42px; border-radius: 50%;
    display: grid; place-items: center; border: 1px solid rgba(245,239,228,0.5); color: var(--gold);
    background: rgba(12,10,9,0.22); }
  .msr-row-go svg { width: 17px; height: 13px; stroke: currentColor; fill: none; stroke-width: 1.5; }

  .msr-foot { position: fixed; left: 0; right: 0; bottom: 0; z-index: 73;
    display: flex; align-items: center; justify-content: center; gap: 12px;
    padding: 16px 20px calc(18px + env(safe-area-inset-bottom));
    font-size: 10.5px; letter-spacing: 0.26em; text-transform: uppercase; color: rgba(245,239,228,0.68);
    background: linear-gradient(to top, rgba(12,10,9,0.97) 0%, rgba(12,10,9,0.7) 58%, rgba(12,10,9,0) 100%); }
  .msr-foot .pt { width: 24px; height: 24px; border-radius: 50%; border: 1px solid rgba(191,164,106,0.55); display: grid; place-items: center; }
  .msr-foot .pt::after { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--gold); }

  /* ---------- ENTRANCE HERO (mobile) ---------- */
  .msr-hero { position: absolute; inset: 0; z-index: 80; background: #0c0a09; display: flex; flex-direction: column;
    overflow-y: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none;
    transition: opacity .6s ease, visibility .6s; }
  .msr-hero::-webkit-scrollbar { display: none; }
  .msr-hero.gone { opacity: 0; visibility: hidden; pointer-events: none; }
  .msr-hero-top { position: absolute; top: 0; left: 0; right: 0; z-index: 3;
    display: flex; align-items: center; justify-content: space-between;
    padding: calc(20px + env(safe-area-inset-top)) 20px 0; }
  .msr-hicon { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center;
    color: var(--ivory); background: rgba(12,10,9,0.34); border: 1px solid rgba(245,239,228,0.34);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); cursor: pointer; transition: border-color .25s ease, color .25s ease; }
  .msr-hicon:active { border-color: var(--gold); color: var(--gold); }
  .msr-hicon svg { width: 19px; height: 19px; }
  .msr-hero-img { position: relative; flex: 0 0 auto; height: 48vh; min-height: 320px; overflow: hidden; }
  .msr-hero-img img { width: 100%; height: 100%; object-fit: cover; object-position: 62% 38%; display: block; }
  .msr-hero-img::after { content: ""; position: absolute; inset: 0;
    background: linear-gradient(to bottom, rgba(12,10,9,0.55) 0%, rgba(12,10,9,0) 26%, rgba(12,10,9,0) 64%, rgba(12,10,9,0.9) 92%, #0c0a09 100%); }
  .msr-hero-body { flex: 1 1 auto; padding: 22px 26px calc(34px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; }
  .msr-hero-eyebrow { display: inline-flex; align-items: center; gap: 16px; font-size: 11px; letter-spacing: 0.3em;
    text-transform: uppercase; color: var(--gold); margin-bottom: 22px; }
  .msr-hero-eyebrow::before { content: ""; width: 38px; height: 1px; background: var(--gold); opacity: 0.85; }
  .msr-hero-title { font-family: var(--serif); font-weight: 300; font-size: clamp(46px, 15vw, 66px); line-height: 0.98;
    letter-spacing: -0.01em; margin: 0; color: var(--ivory); }
  .msr-hero-title .em { font-style: italic; color: var(--gold); }
  .msr-hero-sub { font-size: 15px; font-weight: 300; line-height: 1.65; color: rgba(245,239,228,0.62);
    margin: 26px 0 30px; max-width: 34ch; }
  .msr-enter { display: inline-flex; align-items: center; justify-content: space-between; gap: 14px; width: 100%;
    padding: 20px 26px; background: #b0894e; border: 1px solid #b0894e; color: #1a130c; cursor: pointer;
    font-family: var(--sans); font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 500;
    transition: background .25s ease, transform .15s ease; }
  .msr-enter:active { transform: scale(0.99); background: #c29a5b; }
  .msr-enter svg { width: 22px; height: 13px; stroke: currentColor; fill: none; stroke-width: 1.7; flex: 0 0 auto; }
  .msr-feats { display: grid; grid-template-columns: 1fr 1fr 1fr; margin-top: 34px; }
  .msr-feat { position: relative; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; padding: 4px 8px; }
  .msr-feat + .msr-feat::before { content: ""; position: absolute; left: 0; top: 4px; bottom: 4px; width: 1px; background: rgba(245,239,228,0.14); }
  .msr-feat svg, .msr-feat .fc svg { width: 26px; height: 26px; stroke: var(--gold); fill: none; }
  .msr-feat span:last-child { font-size: 9.5px; letter-spacing: 0.16em; text-transform: uppercase; line-height: 1.5; color: rgba(245,239,228,0.7); }

  @media (max-width: 760px) and (orientation: portrait) {
    .showroom-transition, .vignette, .panels, .intro-wrap, .hint, .inspect, .sample-fab, .topbar, #material { display: none !important; }
    .msr { display: block; }
  }
  /* Forced mobile view (e.g. opened from the mobile site via #mobile) —
     mirrors the portrait media query on any viewport size. */
  html.force-mobile .showroom-transition,
  html.force-mobile .vignette,
  html.force-mobile .panels,
  html.force-mobile .intro-wrap,
  html.force-mobile .hint,
  html.force-mobile .inspect,
  html.force-mobile .sample-fab,
  html.force-mobile .topbar,
  html.force-mobile #material { display: none !important; }
  html.force-mobile .msr { display: block; }
  /* On a wide screen, present the forced-mobile showroom inside a centred

  @media (min-width: 761px) {
